<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survive in UTM</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="game">
        <h1>Welcome to Survive in UTM</h1>
        <p id="story">Can you survive the challenges of university life?</p>

        <div id="stats">
            <p>Energy: <span id="energy">70</span></p>
            <p>Stress: <span id="stress">20</span></p>
            <p>Progress: <span id="progress">0</span></p>
            <p>Actions Left: <span id="actions">7</span></p>
        </div>

        <h2>What will you do?</h2>

        <div id="button">
            <button id="studyButton">Study</button>
            <button id="coffeeButton">Get a Coffee</button>
            <button id="sleepButton">Sleep</button>
            <button id="procrastinateButton">Procrastinate</button>
        </div>

        <p id="message">
            Choose an action to see how it affects your energy, stress, and progress. 
        </p>



    </div>

    <script src="js/script.js"></script>

</body>
</html>
